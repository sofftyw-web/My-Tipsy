<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tipsy — Your Stories</title>
<style>
:root{--bg:#111018;--panel:#1b1924;--panel2:#242130;--text:#f7f3fb;--muted:#aaa4b8;--pink:#ed75ad;--purple:#9b83ed;--line:#353142}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252033 0,#111018 55%);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:1180px;margin:auto;padding:22px 24px 60px}.top{display:flex;align-items:center;gap:18px;margin-bottom:25px}.brand{font-weight:850;font-size:25px;letter-spacing:-.7px;background:linear-gradient(100deg,#ff9ac5,#b5a0ff);color:transparent;background-clip:text}.search{margin-left:auto;max-width:340px;width:100%;position:relative}.search input{width:100%;background:#201e29;border:1px solid var(--line);border-radius:14px;padding:12px 15px 12px 40px;color:var(--text);outline:none}.search:before{content:"⌕";position:absolute;left:14px;top:6px;font-size:25px;color:var(--muted)}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#f28db7,#9582e9);font-weight:800}.hero{padding:32px;border:1px solid #393145;border-radius:25px;background:linear-gradient(115deg,rgba(116,74,126,.38),rgba(54,48,83,.35)),url("data:image/svg+xml,%3Csvg width='500' height='200' viewBox='0 0 500 200' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='420' cy='30' r='90' fill='%23c77ab5' opacity='.12'/%3E%3Ccircle cx='460' cy='160' r='120' fill='%239d8bdf' opacity='.12'/%3E%3C/svg%3E");margin-bottom:30px}.eyebrow{color:#f2a6ce;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.hero h1{font-size:clamp(28px,5vw,43px);line-height:1.1;margin:10px 0}.hero p{color:#d0c9d9;max-width:560px;margin:0 0 20px}.primary{background:linear-gradient(100deg,#e879ad,#a58beb);color:#1b1421;font-weight:800;border-radius:12px;padding:11px 17px}.secondary{background:#302b3d;border:1px solid #494256;border-radius:12px;padding:10px 15px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:27px 0 14px}.section-head h2{font-size:20px;margin:0}.muted{color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 20px}.chip{padding:8px 13px;border-radius:99px;background:#201e29;border:1px solid var(--line);color:#c9c3d3}.chip.active{background:#53334d;border-color:#a85d8b;color:#ffd7e9}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:linear-gradient(160deg,#242130,#1b1924);border:1px solid #332f40;border-radius:18px;overflow:hidden;transition:.18s;min-width:0}.card:hover{transform:translateY(-3px);border-color:#766080}.cover{height:145px;display:flex;align-items:center;justify-content:center;font-size:55px;position:relative;background:linear-gradient(135deg,var(--c1),var(--c2))}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,12,19,.28),transparent)}.tag{position:absolute;z-index:1;left:11px;top:11px;background:#15121dcc;border:1px solid #ffffff25;border-radius:20px;padding:4px 8px;font-size:10px}.card-body{padding:13px}.card h3{font-size:16px;margin:0 0 5px}.card p{font-size:12px;color:var(--muted);margin:0 0 12px;min-height:34px}.card-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.tiny{font-size:12px;color:#c4b7d0}.open{background:#3a3046;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}.tabs{display:flex;gap:7px}.tab{padding:8px 12px;border-radius:10px;color:var(--muted);background:transparent}.tab.active{background:#302a3c;color:#fff}.hidden{display:none!important}.view{margin-top:16px}.back{background:transparent;color:#d4cadd;padding:8px 0;margin-bottom:12px}.profile{display:grid;grid-template-columns:260px 1fr;gap:22px}.profile-art{border-radius:20px;min-height:300px;display:grid;place-items:center;font-size:100px;background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid #ffffff18}.profile-info{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:23px}.profile-info h2{font-size:28px;margin:4px 0}.chat{border:1px solid var(--line);border-radius:20px;background:#191721;overflow:hidden;max-width:800px;margin:0 auto}.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.chat-head .avatar{width:42px;height:42px}.chat-messages{height:430px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;background:#2a2735;color:#f2edf6;white-space:pre-wrap}.bubble.me{align-self:flex-end;background:linear-gradient(110deg,#704b71,#62528b)}.bubble.bot{align-self:flex-start}.chat-compose{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line)}.chat-compose input{flex:1;min-width:0;background:#24212d;border:1px solid var(--line);border-radius:12px;padding:12px;color:white;outline:none}.modal-back{position:fixed;inset:0;background:#08070bd9;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(520px,100%);background:#211e2a;border:1px solid #484054;border-radius:20px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin-top:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#c5bdcf}.field input,.field textarea,.field select{width:100%;background:#15131b;border:1px solid #40394c;border-radius:10px;padding:10px;color:white;outline:none}.field textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:16px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.profile{grid-template-columns:1fr 1.5fr}.profile-art{min-height:230px}}@media(max-width:560px){.app{padding:15px}.top{gap:10px}.brand{font-size:21px}.search{max-width:none}.avatar.top-avatar{display:none}.hero{padding:23px}.grid{gap:10px}.cover{height:115px;font-size:44px}.card-body{padding:10px}.profile{grid-template-columns:1fr}.profile-art{min-height:180px}.chat-messages{height:55vh}.bubble{max-width:90%}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">✦ My Tipsy</div><div class="search"><input id="search" placeholder="Поиск историй и персонажей…"></div><div class="avatar top-avatar">M</div></header>
<main id="home">
<section class="hero"><div class="eyebrow">Твоя история начинается здесь</div><h1>Кем ты станешь<br>в этой истории?</h1><p>Выбирай мир, знакомься с персонажами и создавай собственные сюжеты. Здесь каждая история может пойти по-своему.</p><button class="primary" id="explore">Исследовать истории　↘</button></section>
<div class="section-head"><h2>Открой свой мир</h2><button class="secondary" id="createBtn">＋ Создать персонажа</button></div>
<div class="chips" id="filters"></div>
<div class="section-head"><h2 id="listTitle">Популярные истории</h2><span class="muted" id="count"></span></div>
<div class="grid" id="catalog"></div>
<div class="section-head"><h2>Мои персонажи</h2></div><div class="grid" id="mine"></div>
</main>
<section id="profileView" class="view hidden"></section>
<section id="chatView" class="view hidden"></section>
</div>
<div id="modalRoot"></div>
<script>
const categories=["Все","Романтика","Тёмная романтика","Фэнтези","Приключения","Драма","Мистика"];
const defaults=[
{id:"a",name:"Александр Вейл",category:"Тёмная романтика",emoji:"🖤",colors:["#482b40","#171927"],tag:"Тёмная романтика",desc:"Холодный наследник, который привык всё контролировать.",bio:"Александр — наследник влиятельной семьи. Он сдержан, наблюдателен и редко показывает эмоции. За его холодностью скрывается история, о которой он никому не рассказывает.",opening:"Поздний вечер. Александр стоит у окна особняка, когда слышит шаги за спиной. Он медленно оборачивается.\n\n— Ты всё-таки пришла. Я уже начал думать, что ты передумала.",prompt:"Он смотрит на тебя внимательно, ожидая ответа."},
{id:"b",name:"Лея и лунный лес",category:"Фэнтези",emoji:"🌙",colors:["#30476c","#604d83"],tag:"Фэнтези",desc:"Тайна древнего леса и девушка, умеющая слышать магию.",bio:"Лея — юная хранительница леса. Она слышит голоса древних деревьев и ищет источник странного свечения, появившегося у старых руин.",opening:"Лес светится мягким серебряным светом. Лея выходит из-за дерева, держа в руках маленький фонарь.\n\n— Тише. Он уже знает, что мы здесь.",prompt:"Она переводит взгляд на тёмные руины."},
{id:"c",name:"Случайная встреча",category:"Романтика",emoji:"☕",colors:["#a66a70","#563d60"],tag:"Романтика",desc:"Незнакомец, дождливый вечер и разговор, который всё меняет.",bio:"Марк — музыкант, который часто прячется от шума большого города в маленькой кофейне. Он кажется немного рассеянным, но замечает детали, которые другие пропускают.",opening:"За окном шумит дождь. В кофейне почти никого нет. Парень за соседним столиком поднимает глаза от блокнота.\n\n— Прости, это место свободно? Кажется, все остальные столики заняты.",prompt:"Он чуть улыбается и убирает блокнот."},
{id:"d",name:"Последний поезд",category:"Мистика",emoji:"🚉",colors:["#3a5360","#28243c"],tag:"Мистика",desc:"Ночной вокзал, поезд без расписания и загадочный попутчик.",bio:"Никто не знает, откуда появляется ночной поезд. Твой попутчик знает о нём слишком много, но отвечает загадками.",opening:"На пустом вокзале часы показывают 00:17. Поезд бесшумно останавливается у платформы. В дверях появляется незнакомец в длинном пальто.\n\n— Если сядешь, назад вернуться будет непросто.",prompt:"Он протягивает руку, приглашая тебя в вагон."},
{id:"e",name:"Команда «Север»",category:"Приключения",emoji:"🏔️",colors:["#4a6a76","#39435c"],tag:"Приключения",desc:"Экспедиция в горы, где пропала предыдущая команда.",bio:"Ты присоединяешься к небольшой экспедиции. У каждого участника свои причины оказаться здесь, а погода быстро ухудшается.",opening:"Ветер треплет палатку. Руководитель экспедиции раскладывает карту на ящике.\n\n— До перевала два часа. Но сначала решим, кто пойдёт проверять сигнал у старой станции.",prompt:"Все смотрят на тебя."},
{id:"f",name:"После полуночи",category:"Драма",emoji:"🌃",colors:["#4b3d69","#28263e"],tag:"Драма",desc:"Друзья, музыка и разговоры на балконе до рассвета.",bio:"Небольшая компания друзей собирается на крыше многоэтажки. У каждого накопились слова, которые давно хотелось сказать.",opening:"Город мерцает внизу. Из комнаты доносится тихая музыка. Твой знакомый опирается на перила балкона.\n\n— Не спится? Мне тоже. Хочешь поговорить?",prompt:"Он протягивает тебе банку холодного напитка."}
];
let custom=JSON.parse(localStorage.getItem("myTipsyChars")||"[]"), all=[...defaults,...custom], activeCat="Все", selected=null, chatChar=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function card(c){return `<article class="card"><div class="cover" style="--c1:${c.colors?.[0]||"#6a4b72"};--c2:${c.colors?.[1]||"#29233c"}"><span class="tag">${esc(c.tag||c.category)}</span>${esc(c.emoji||"✨")}</div><div class="card-body"><h3>${esc(c.name)}</h3><p>${esc(c.desc||c.bio||"Твоя новая история начинается здесь.")}</p><div class="card-actions"><span class="tiny">✦ История</span><button class="open" data-open="${esc(c.id)}">Открыть →</button></div></div></article>`}
function render(){let q=$("search").value.toLowerCase().trim();let list=all.filter(c=>(activeCat==="Все"||c.category===activeCat)&&(!q||(c.name+" "+c.category+" "+c.desc+" "+c.bio).toLowerCase().includes(q)));$("catalog").innerHTML=list.length?list.map(card).join(""):`<div class="empty" style="grid-column:1/-1">Ничего не найдено. Попробуй другой запрос или категорию.</div>`;$("count").textContent=list.length+" историй";$("mine").innerHTML=custom.length?custom.map(card).join(""):`<div class="empty" style="grid-column:1/-1">Здесь появятся персонажи, которых ты создашь.</div>`;$("filters").innerHTML=categories.map(x=>`<button class="chip ${x===activeCat?"active":""}" data-cat="${esc(x)}">${esc(x)}</button>`).join("");}
function showHome(){ $("home").classList.remove("hidden");$("profileView").classList.add("hidden");$("chatView").classList.add("hidden");}
function openProfile(id){selected=all.find(c=>c.id===id);if(!selected)return;$("home").classList.add("hidden");$("chatView").classList.add("hidden");let c=selected;$("profileView").classList.remove("hidden");$("profileView").innerHTML=`<button class="back" id="backHome">← Назад к историям</button><div class="profile"><div class="profile-art" style="--c1:${c.colors?.[0]||"#6a4b72"};--c2:${c.colors?.[1]||"#29233c"}">${esc(c.emoji||"✨")}</div><div class="profile-info"><div class="eyebrow">${esc(c.category)}</div><h2>${esc(c.name)}</h2><p class="muted">${esc(c.desc||"")}</p><h3>О персонаже и истории</h3><p>${esc(c.bio||"")}</p><div style="margin-top:22px"><button class="primary" id="startChat">Начать историю　✦</button></div></div></div>`;$("backHome").onclick=showHome;$("startChat").onclick=()=>openChat(c);}
function chatKey(c){return "myTipsyChat_"+c.id}
function openChat(c){chatChar=c;$("home").classList.add("hidden");$("profileView").classList.add("hidden");$("chatView").classList.remove("hidden");let msgs=JSON.parse(localStorage.getItem(chatKey(c))||"[]");if(!msgs.length)msgs=[{who:"bot",text:c.opening||"История начинается. Что ты сделаешь?"}];drawChat(msgs);}
function drawChat(msgs){let c=chatChar;$("chatView").innerHTML=`<div class="chat"><div class="chat-head"><button class="back" id="backProfile">←</button><div class="avatar">${esc(c.emoji||"✦")}</div><div><strong>${esc(c.name)}</strong><div class="tiny">${esc(c.category)} · твоя история</div></div></div><div class="chat-messages" id="messages">${msgs.map(m=>`<div class="bubble ${m.who==="me"?"me":"bot"}">${esc(m.text)}</div>`).join("")}</div><div class="chat-compose"><input id="messageInput" placeholder="Напиши свой ответ…" autocomplete="off"><button class="primary" id="send">➤</button></div></div><p class="muted" style="font-size:12px;text-align:center;margin-top:10px">Демо-режим: ответы пока локальные, настоящий ИИ ещё не подключён.</p>`;$("backProfile").onclick=()=>openProfile(c.id);$("send").onclick=sendMessage;$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});$("messages").scrollTop=$("messages").scrollHeight;}
function sendMessage(){let input=$("messageInput"),text=input.value.trim();if(!text)return;let msgs=JSON.parse(localStorage.getItem(chatKey(chatChar))||"[]");if(!msgs.length)msgs=[{who:"bot",text:chatChar.opening||"История начинается. Что ты сделаешь?"}];msgs.push({who:"me",text});let reply=chatChar.prompt||"Он внимательно слушает тебя. В его взгляде появляется интерес.\n\n— Продолжай. Что ты предлагаешь?";msgs.push({who:"bot",text:reply});localStorage.setItem(chatKey(chatChar),JSON.stringify(msgs));drawChat(msgs);}
function createModal(){ $("modalRoot").innerHTML=`<div class="modal-back" id="modalBack"><div class="modal"><h2>Создать персонажа</h2><p class="muted">Придумай героя для своей собственной истории.</p><div class="field"><label>Имя персонажа *</label><input id="newName" placeholder="Например, Алекс"></div><div class="field"><label>Категория</label><select id="newCat">${categories.filter(x=>x!=="Все").map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>Эмодзи / символ</label><input id="newEmoji" maxlength="4" value="✨"></div><div class="field"><label>Краткое описание</label><input id="newDesc" placeholder="Кто этот персонаж?"></div><div class="field"><label>Предыстория</label><textarea id="newBio" placeholder="Характер, прошлое, особенности…"></textarea></div><div class="field"><label>Первое сообщение</label><textarea id="newOpening" placeholder="С чего начинается ваша история?"></textarea></div><div class="modal-actions"><button class="secondary" id="cancel">Отмена</button><button class="primary" id="saveChar">Создать</button></div></div></div>`;$("cancel").onclick=()=>$("modalRoot").innerHTML="";$("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")$("modalRoot").innerHTML=""});$("saveChar").onclick=()=>{let name=$("newName").value.trim();if(!name){$("newName").focus();return}let c={id:"u"+Date.now(),name,category:$("newCat").value,emoji:$("newEmoji").value||"✨",colors:["#805c82","#302b4a"],tag:$("newCat").value,desc:$("newDesc").value.trim(),bio:$("newBio").value.trim(),opening:$("newOpening").value.trim()||"Вы встречаетесь впервые. Персонаж смотрит на тебя с любопытством.",prompt:"Он ждёт твоего ответа."};custom.push(c);localStorage.setItem("myTipsyChars",JSON.stringify(custom));all=[...defaults,...custom];$("modalRoot").innerHTML="";activeCat="Все";render();};}
$("filters").addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(b){activeCat=b.dataset.cat;render()}});
document.addEventListener("click",e=>{let b=e.target.closest("[data-open]");if(b)openProfile(b.dataset.open)});
$("search").addEventListener("input",render);$("createBtn").onclick=createModal;$("explore").onclick=()=>$("catalog").scrollIntoView({behavior:"smooth",block:"start"});
render();
</script>
</body>
</html>
